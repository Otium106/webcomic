<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地漫画阅览器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #comic-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer; /* 鼠标变成手型，提示可以点击 */
            user-select: none;
            flex-grow: 1; /* 让图片区域占满剩余空间 */
        }
        #comic-image {
            max-width: 100%;
            max-height: 85vh; /* 保证图片不会超出屏幕太多 */
            object-fit: contain;
        }
        #controls {
            margin: 20px 0;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #page-info {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="comic-container" onclick="handleContainerClick(event)">
        <div id="welcome-tips" style="padding: 40px; text-align: center; color: #aaa;">
            <h2>📖 欢迎使用漫画阅览器</h2>
            <p>请点击下方按钮选择您的漫画 ZIP 压缩包</p>
        </div>
        <img id="comic-image" src="" alt="" style="display: none;" />
    </div>

    <div id="controls">
        <input type="file" id="file-input" accept=".zip" />
        <div id="nav-buttons" style="margin-top: 10px;">
            <button class="btn" id="prev-btn" onclick="prevPage()" disabled>上一页</button>
            <button class="btn" id="next-btn" onclick="nextPage()" disabled>下一页</button>
        </div>
        <div id="page-info">请选择包含漫画图片的 ZIP 压缩包</div>
    </div>

    <script>
        let imageFiles = []; // 存储解压出来的图片文件名和数据
        let currentIndex = 0; // 当前阅读的页码

        // 初始化/重置页面的函数
        function resetViewer(message) {
            imageFiles = [];
            currentIndex = 0;
            
            // 重置输入框
            document.getElementById('file-input').value = "";
            
            // 隐藏图片，显示欢迎提示
            document.getElementById('comic-image').style.display = "none";
            document.getElementById('comic-image').src = "";
            document.getElementById('welcome-tips').style.display = "block";
            
            // 禁用按钮
            document.getElementById('prev-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
            
            // 更新提示文字
            document.getElementById('page-info').innerText = message || "请选择包含漫画图片的 ZIP 压缩包";
        }

        document.getElementById('file-input').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const pageInfo = document.getElementById('page-info');
            pageInfo.innerText = "正在解压漫画，请稍候...";
            document.getElementById('welcome-tips').style.display = "none";
            
            imageFiles = [];
            currentIndex = 0;

            try {
                const zip = await JSZip.loadAsync(file);
                const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
                
                for (let filename in zip.files) {
                    const isImage = validExtensions.some(ext => filename.toLowerCase().endsWith(ext));
                    const isMacFolder = filename.includes('__MACOSX'); 
                    
                    if (isImage && !isMacFolder) {
                        imageFiles.push(zip.files[filename]);
                    }
                }

                if (imageFiles.length === 0) {
                    resetViewer("压缩包内没有找到支持的图片文件！");
                    return;
                }

                // 按照文件名排序
                imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

                // 启用按钮并
