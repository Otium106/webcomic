<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日漫风-智能横竖屏阅览器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #comic-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            cursor: pointer;
            flex-grow: 1;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 

            /* 上下空隙 */
            padding-top: 40px; 
            padding-bottom: 40px; 
        }
        #comic-wrapper {
            display: flex;
            width: 100%;
            max-width: 100%;
            justify-content: center;
        }
        /* 💡 核心改動 1：雙頁模式下，利用 flex-direction: row-reverse 讓右邊顯示前一頁，左邊顯示後一頁 */
        .double-page {
            flex-direction: row-reverse; 
        }
        .comic-img {
            object-fit: contain;
            max-height: 85vh;
            -webkit-user-drag: none;
            width: 100%;
            max-width: 100%;
        }
        .double-page .comic-img {
            width: 50%;
            max-width: 50%;
        }
        #welcome-tips {
            padding: 60px 20px;
            text-align: center;
            color: #aaa;
            width: 100%;
        }
        #controls {
            margin: 20px 0;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #page-info {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="comic-container" onclick="handleContainerClick(event)">
        <div id="welcome-tips">
            <h2>📖 日漫风-智能漫画阅览器</h2>
            <p>请点击下方按钮选择您的漫画 ZIP 压缩包</p>
            <p style="font-size: 13px; color: #ff6b6b;">(已开启：从右往左阅读模式)</p>
        </div>
        <div id="comic-wrapper" class="">
            <img id="comic-image-first" class="comic-img" src="" alt="" style="display: none;" />
            <img id="comic-image-second" class="comic-img" src="" alt="" style="display: none;" />
        </div>
    </div>

    <div id="controls">
        <input type="file" id="file-input" accept=".zip" />
        <div id="nav-buttons" style="margin-top: 10px;">
            <button class="btn" id="next-btn" onclick="nextPage()" disabled>下一页 ◀</button>
            <button class="btn" id="prev-btn" onclick="prevPage()" disabled>▶ 上一页</button>
        </div>
        <div id="page-info">请选择包含漫画图片的 ZIP 压缩包</div>
    </div>

    <script>
        let imageFiles = []; 
        let currentIndex = 0; 

        function isLandscape() {
            return window.innerWidth > window.innerHeight;
        }

        function resetViewer(message) {
            imageFiles = [];
            currentIndex = 0;
            document.getElementById('file-input').value = "";
            document.getElementById('comic-image-first').style.display = "none";
            document.getElementById('comic-image-first').src = "";
            document.getElementById('comic-image-second').style.display = "none";
            document.getElementById('comic-image-second').src = "";
            document.getElementById('welcome-tips').style.display = "block";
            document.getElementById('prev-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('page-info').innerText = message || "请选择包含漫画图片的 ZIP 压缩包";
        }

        document.getElementById('file-input').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('page-info').innerText = "正在解压漫画，请稍候...";
            imageFiles = [];
            currentIndex = 0;

            try {
                const zip = await JSZip.loadAsync(file);
                const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
                
                for (let filename in zip.files) {
                    const isImage = validExtensions.some(ext => filename.toLowerCase().endsWith(ext));
                    const isMacFolder = filename.includes('__MACOSX'); 
                    
                    if (isImage && !isMacFolder) {
                        imageFiles.push(zip.files[filename]);
                    }
                }

                if (imageFiles.length === 0) {
                    resetViewer("压缩包内没有找到支持的图片文件！");
                    return;
                }

                imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

                document.getElementById('welcome-tips').style.display = "none";
                document.getElementById('prev-btn').disabled = false;
                document.getElementById('next-btn').disabled = false;
                showPage(0);

            } catch (error) {
                console.error(error);
                resetViewer("解压失败，请确保文件是标准的 ZIP 格式。");
            }
        });

        async function showPage(index) {
            if (imageFiles.length === 0) return;
            if (index < 0) index = 0;
            
            if (index >= imageFiles.length) {
                resetViewer("漫画已看完！已为您重置，可重新选择新漫画。");
                return;
            }

            currentIndex = index;
            const imgFirst = document.getElementById('comic-image-first');
            const imgSecond = document.getElementById('comic-image-second');
            const wrapper = document.getElementById('comic-wrapper');
            const pageInfo = document.getElementById('page-info');

            if (imgFirst.src.startsWith('blob:')) URL.revokeObjectURL(imgFirst.src);
            if (imgSecond.src.startsWith('blob:')) URL.revokeObjectURL(imgSecond.src);

            if (isLandscape() && currentIndex + 1 < imageFiles.length) {
                // 💻 横屏：双页。样式上有 row-reverse，所以 first 在右，second 在左
                wrapper.className = "double-page";
                imgFirst.style.display = "block";
                imgSecond.style.display = "block";

                const blobFirst = await imageFiles[currentIndex].async("blob");
                imgFirst.src = URL.createObjectURL(blobFirst); // 右边显示当前页

                const blobSecond = await imageFiles[currentIndex + 1].async("blob");
                imgSecond.src = URL.createObjectURL(blobSecond); // 左边显示下一页

                pageInfo.innerText = `第 ${currentIndex + 2} - ${currentIndex + 1} / ${imageFiles.length} 页 (右 → 左)`;
            } else {
                // 📱 竖屏：单页正常显示
                wrapper.className = "";
                imgFirst.style.display = "block";
                imgSecond.style.display = "none";

                const blob = await imageFiles[currentIndex].async("blob");
                imgFirst.src = URL.createObjectURL(blob);

                pageInfo.innerText = `第 ${currentIndex + 1} / ${imageFiles.length} 页`;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevPage() {
            if (currentIndex === 0) return;
            if (isLandscape()) {
                showPage(currentIndex - 2);
            } else {
                showPage(currentIndex - 1);
            }
        }

        function nextPage() {
            if (isLandscape() && currentIndex + 1 < imageFiles.length) {
                showPage(currentIndex + 2);
            } else {
                showPage(currentIndex + 1);
            }
        }

        // 💡 核心改動 2：點擊事件反轉
        function handleContainerClick(event) {
            if (imageFiles.length === 0) return;
            
            const containerWidth = window.innerWidth;
            const clickX = event.clientX;

            // 從右往左看：點擊螢幕「左側 2/3 區域」為下一頁，點擊「右側 1/3 區域」為上一頁
            if (clickX < containerWidth * 0.66) {
                nextPage();
            } else {
                prevPage();
            }
        }

        // 💡 核心改動 3：鍵盤方向鍵反轉 (左箭頭下一頁，右箭頭上一頁)
        document.addEventListener('keydown', (event) => {
            if (imageFiles.length === 0) return;
            if (event.key === 'ArrowLeft') {
                nextPage();
            } else if (event.key === 'ArrowRight') {
                prevPage();
            }
        });

        window.addEventListener('resize', () => {
            if (imageFiles.length > 0) {
                showPage(currentIndex);
            }
        });
    </script>
</body>
</html>
