<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地漫画阅览器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #comic-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-grow: 1;
            
            /* 防止双击或长按导致图片被选中变蓝 */
            user-select: none;
            -webkit-user-select: none;
            
            /* 去除移动端点击时的半透明蓝色高亮 */
            -webkit-tap-highlight-color: transparent;
        }
        #comic-image {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            
            /* 额外保险：防止图片本身在某些旧系统被拉动或选中 */
            -webkit-user-drag: none; 
        }
        #welcome-tips {
            padding: 60px 20px;
            text-align: center;
            color: #aaa;
        }
        #controls {
            margin: 20px 0;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #page-info {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="comic-container" onclick="handleContainerClick(event)">
        <div id="welcome-tips">
            <h2>📖 欢迎使用漫画阅览器</h2>
            <p>请点击下方按钮选择您的漫画 ZIP 压缩包</p>
        </div>
        <img id="comic-image" src="" alt="" style="display: none;" />
    </div>

    <div id="controls">
        <input type="file" id="file-input" accept=".zip" />
        <div id="nav-buttons" style="margin-top: 10px;">
            <button class="btn" id="prev-btn" onclick="prevPage()" disabled>上一页</button>
            <button class="btn" id="next-btn" onclick="nextPage()" disabled>下一页</button>
        </div>
        <div id="page-info">请选择包含漫画图片的 ZIP 压缩包</div>
    </div>

    <script>
        let imageFiles = []; 
        let currentIndex = 0; 

        function resetViewer(message) {
            imageFiles = [];
            currentIndex = 0;
            document.getElementById('file-input').value = "";
            document.getElementById('comic-image').style.display = "none";
            document.getElementById('comic-image').src = "";
            document.getElementById('welcome-tips').style.display = "block";
            document.getElementById('prev-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('page-info').innerText = message || "请选择包含漫画图片的 ZIP 压缩包";
        }

        document.getElementById('file-input').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const pageInfo = document.getElementById('page-info');
            pageInfo.innerText = "正在解压漫画，请稍候...";
            
            imageFiles = [];
            currentIndex = 0;

            try {
                const zip = await JSZip.loadAsync(file);
                const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
                
                for (let filename in zip.files) {
                    const isImage = validExtensions.some(ext => filename.toLowerCase().endsWith(ext));
                    const isMacFolder = filename.includes('__MACOSX'); 
                    
                    if (isImage && !isMacFolder) {
                        imageFiles.push(zip.files[filename]);
                    }
                }

                if (imageFiles.length === 0) {
                    resetViewer("压缩包内没有找到支持的图片文件！");
                    return;
                }

                imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

                document.getElementById('welcome-tips').style.display = "none";
                document.getElementById('prev-btn').disabled = false;
                document.getElementById('next-btn').disabled = false;
                showPage(0);

            } catch (error) {
                console.error(error);
                resetViewer("解压失败，请确保文件是标准的 ZIP 格式。");
            }
        });

        async function showPage(index) {
            if (index < 0 || index >= imageFiles.length) return;
            
            currentIndex = index;
            const fileObject = imageFiles[currentIndex];
            const imgElement = document.getElementById('comic-image');
            const pageInfo = document.getElementById('page-info');

            pageInfo.innerText = `第 ${currentIndex + 1} / ${imageFiles.length} 页`;

            const blob = await fileObject.async("blob");
            const imageUrl = URL.createObjectURL(blob);

            if (imgElement.src && imgElement.src.startsWith('blob:')) {
                URL.revokeObjectURL(imgElement.src);
            }

            imgElement.src = imageUrl;
            imgElement.style.display = "block";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevPage() {
            if (currentIndex > 0) {
                showPage(currentIndex - 1);
            }
        }

        function nextPage() {
            if (currentIndex < imageFiles.length - 1) {
                showPage(currentIndex + 1);
            } else {
                resetViewer("漫画已看完！已为您重置，可重新选择新漫画。");
            }
        }

        function handleContainerClick(event) {
            if (imageFiles.length === 0) return;
            
            const containerWidth = window.innerWidth;
            const clickX = event.clientX;

            if (clickX > containerWidth / 3) {
                nextPage();
            } else {
                prevPage();
            }
        }

        document.addEventListener('keydown', (event) => {
            if (imageFiles.length === 0) return;
            if (event.key === 'ArrowRight') {
                nextPage();
            } else if (event.key === 'ArrowLeft') {
                prevPage();
            }
        });
    </script>
</body>
</html>
