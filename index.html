<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看什么看</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #comic-container {
            width: 100%;
            height: 100vh; /* 容器等于整个屏幕高度 */
            display: flex;
            justify-content: center;
            align-items: center;   /* 居中对齐 */
            cursor: pointer;
            flex-grow: 1;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
            position: relative; /* 允许内部元素绝对定位 */
        }
        #comic-wrapper {
            display: flex;
            width: 100%;
            max-width: 100%;
            justify-content: center;
            height: 100vh; /* 强制包裹层高度填满，让图片可以等比例放大 */
        }
        /* 双页模式下，利用 row-reverse 确保右边显示前一页（第1页），左边显示后一页（第2页） */
        .double-page {
            flex-direction: row-reverse; 
        }
        .comic-img {
            height: 100%;
            object-fit: contain; /* 等比例缩放贴边：不裁剪、不拉伸变形 */
            -webkit-user-drag: none;
            /* 默认单页竖屏模式：宽度100%顶满 */
            width: 100%;
            max-width: 100%;
        }
        /* 双页横屏模式：两张图横向并排，各占一半宽度 */
        .double-page .comic-img {
            width: 50%;
            max-width: 50%;
        }
        /* 💡 核心修正：使用绝对定位撑满整个屏幕，确保欢迎文字永远在真正的物理中心点 */
        #welcome-tips {
            text-align: center;
            color: #aaa;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }
        #controls {
            margin: 20px 0;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #page-info {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="comic-container" onclick="handleContainerClick(event)">
        <div id="welcome-tips">
            <h2>📖 看什么看</h2>
            <p>请点击下方按钮选择您的漫画 ZIP 压缩包</p>
            <p style="font-size: 13px; color: #ff6b6b;">(右 → 左阅读 | 竖屏单页 | 横屏双页并排)</p>
        </div>
        <div id="comic-wrapper" class="">
            <img id="comic-image-first" class="comic-img" src="" alt="" style="display: none;" />
            <img id="comic-image-second" class="comic-img" src="" alt="" style="display: none;" />
        </div>
    </div>

    <div id="controls">
        <input type="file" id="file-input" accept=".zip" />
        <div id="nav-buttons" style="margin-top: 10px;">
            <button class="btn" id="next-btn" onclick="nextPage()" disabled>下一页 ◀</button>
            <button class="btn" id="prev-btn" onclick="prevPage()" disabled>▶ 上一页</button>
        </div>
        <div id="page-info">请选择包含漫画图片的 ZIP 压缩包</div>
    </div>

    <script>
        let imageFiles = []; 
        let currentIndex = 0; 

        // 检测横屏（宽大于高）
        function isLandscape() {
            return window.innerWidth > window.innerHeight;
        }

        // 初始化重置
        function resetViewer(message) {
            imageFiles = [];
            currentIndex = 0;
            document.getElementById('file-input').value = "";
            document.getElementById('comic-image-first').style.display = "none";
            document.getElementById('comic-image-first').src = "";
            document.getElementById('comic-image-second').style.display = "none";
            document.getElementById('comic-image-second').src = "";
            document.getElementById('welcome-tips').style.display = "flex"; // 恢复显示
            document.getElementById('prev-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('page-info').innerText = message || "请选择包含漫画图片的 ZIP 压缩包";
        }

        document.getElementById('file-input').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('page-info').innerText = "正在解压漫画，请稍候...";
            imageFiles = [];
            currentIndex = 0;

            try {
                const zip = await JSZip.loadAsync(file);
                const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
                
                for (let filename in zip.files) {
                    const isImage = validExtensions.some(ext => filename.toLowerCase().endsWith(ext));
                    const isMacFolder = filename.includes('__MACOSX'); 
                    
                    if (isImage && !isMacFolder) {
                        imageFiles.push(zip.files[filename]);
                    }
                }

                if (imageFiles.length === 0) {
                    resetViewer("压缩包内没有找到支持的图片文件！");
                    return;
                }

                // 文件名自然排序
                imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

                document.getElementById('welcome-tips').style.display = "none"; // 成功后隐藏
                document.getElementById('prev-btn').disabled = false;
                document.getElementById('next-btn').disabled = false;
                showPage(0);

            } catch (error) {
                console.error(error);
                resetViewer("解压失败，请确保文件是标准的 ZIP 格式。");
            }
        });

        // 渲染页面
        async function showPage(index) {
            if (imageFiles.length === 0) return;
            if (index < 0) index = 0;
            
            // 看完最后一页，直接初始化
            if (index >= imageFiles.length) {
                resetViewer("漫画已看完！已为您重置，可重新选择新漫画。");
                return;
            }

            currentIndex = index;
            const imgFirst = document.getElementById('comic-image-first');
            const imgSecond = document.getElementById('comic-image-second');
            const wrapper = document.getElementById('comic-wrapper');
            const pageInfo = document.getElementById('page-info');

            // 释放旧内存
            if (imgFirst.src.startsWith('blob:')) URL.revokeObjectURL(imgFirst.src);
            if (imgSecond.src.startsWith('blob:')) URL.revokeObjectURL(imgSecond.src);

            if (isLandscape() && currentIndex + 1 < imageFiles.length) {
                // 💻 横屏：双页横向并排。结合 CSS row-reverse，first 在右，second 在左
                wrapper.className = "double-page";
                imgFirst.style.display = "block";
                imgSecond.style.display = "block";

                const blobFirst = await imageFiles[currentIndex].async("blob");
                imgFirst.src = URL.createObjectURL(blobFirst);

                const blobSecond = await imageFiles[currentIndex + 1].async("blob");
                imgSecond.src = URL.createObjectURL(blobSecond);

                pageInfo.innerText = `第 ${currentIndex + 2} - ${currentIndex + 1} / ${imageFiles.length} 页 (右 → 左)`;
            } else {
                // 📱 竖屏：单页全屏居中贴边
                wrapper.className = "";
                imgFirst.style.display = "block";
                imgSecond.style.display = "none";

                const blob = await imageFiles[currentIndex].async("blob");
                imgFirst.src = URL.createObjectURL(blob);

                pageInfo.innerText = `第 ${currentIndex + 1} / ${imageFiles.length} 页`;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 往前看（日漫逻辑）
        function prevPage() {
            if (currentIndex === 0) return;
            if (isLandscape()) {
                showPage(currentIndex - 2);
            } else {
                showPage(currentIndex - 1);
            }
        }

        // 往后看（日漫逻辑）
        function nextPage() {
            if (isLandscape() && currentIndex + 1 < imageFiles.length) {
                showPage(currentIndex + 2);
            } else {
                showPage(currentIndex + 1);
            }
        }

        // 屏幕点击翻页
        function handleContainerClick(event) {
            if (imageFiles.length === 0) return;
            
            const containerWidth = window.innerWidth;
            const clickX = event.clientX;

            // 日漫习惯：点击屏幕「左侧 2/3 区域」去下一页，点击「右侧 1/3 区域」回上一页
            if (clickX < containerWidth * 0.66) {
                nextPage();
            } else {
                prevPage();
            }
        }

        // 监听设备旋转或缩放
        window.addEventListener('resize', () => {
            if (imageFiles.length > 0) {
                showPage(currentIndex);
            }
        });

        // 键盘方向键监听（左箭头下一页，右箭头上一页）
        document.addEventListener('keydown', (event) => {
            if (imageFiles.length === 0) return;
            if (event.key === 'ArrowLeft') {
                nextPage();
            } else if (event.key === 'ArrowRight') {
                prevPage();
            }
        });
    </script>
</body>
</html>
